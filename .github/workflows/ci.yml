name: CI C

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de la chaîne de compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential imagemagick wget python3-pip

      - name: Compilation avec les avertissements traités comme des erreurs
        run: make check

      - name: Installation du lanceur de tests
        run: python3 -m pip install --user pytest

      - name: Exécution de la suite de tests d’intégration
        run: python3 -m pytest -q

      - name: Nettoyage de l’arbre de compilation
        run: make clean
